name: Servo workbench (no hardware)
on: [push, pull_request]
jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyserial==3.5 dynamixel-sdk==3.8.4
      - run: python -B -m unittest discover -s servo_workbench/tests -q
